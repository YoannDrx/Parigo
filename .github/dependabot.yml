version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      compatible-minor-updates:
        update-types:
          - minor
          - patch
    ignore:
      # Major upgrades are deliberate migrations reviewed on dedicated branches.
      # Dependabot remains responsible for the grouped minor and patch updates.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5

<!--
  Prototype uniquement. Ne pas coller en production sans avoir d'abord remplacé
  le template global Harvest. Harvest remplace [link] par un élément <a> complet.
-->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#111211;border-collapse:separate;border-spacing:0;border-radius:28px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#f5f1e8;">
  <tr>
    <td style="padding:36px 36px 20px 36px;">
      <img src="https://parigo-ten.vercel.app/images/parigo-logo-email.png" width="175" alt="Parigo Music" style="display:block;width:175px;max-width:100%;height:auto;border:0;">
    </td>
  </tr>
  <tr>
    <td style="padding:8px 36px 12px 36px;">
      <span style="display:inline-block;padding:7px 12px;border:1px solid #d1e653;border-radius:999px;color:#d1e653;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:1.4px;">[contenttype] partagé</span>
    </td>
  </tr>
  <tr>
    <td style="padding:4px 36px 12px 36px;font-size:34px;line-height:1.12;font-weight:700;color:#f5f1e8;">
      Votre Playlist Parigo
    </td>
  </tr>
  <tr>
    <td style="padding:0 36px 28px 36px;font-size:16px;line-height:1.55;color:#c9c7bf;">
      [senderfirstname] [sendersurname] vous invite à découvrir une sélection musicale.
    </td>
  </tr>
  <tr>
    <td style="padding:0 36px 16px 36px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#d1e653;border-radius:18px;border-collapse:separate;">
        <tr>
          <td align="center" style="padding:18px 22px;font-size:15px;line-height:1.4;font-weight:700;color:#111211;word-break:break-word;">
            [link]
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="padding:0 36px 18px 36px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f5f1e8;border-radius:18px;border-collapse:separate;">
        <tr>
          <td style="padding:22px;color:#272823;font-size:14px;line-height:1.6;">
            <div style="margin-bottom:8px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#73756b;">Message de l’expéditeur</div>
            [message]
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="padding:6px 36px 34px 36px;font-size:12px;line-height:1.5;color:#8e9087;">
      Parigo Music · Music for pictures
    </td>
  </tr>
</table>
